[project]
name = "aurora"
version = "0.1.0"
description = "AURORA: offline-first AI energy management for polar research stations (SIH PS 26061)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "pvlib>=0.11",
    "pyomo>=6.7",
    "highspy>=1.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pymodbus>=3.6",
    "paho-mqtt>=2.0",
    "httpx>=0.27",
]

[project.scripts]
aurora = "aurora.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
